{% load static %}
<header class="navbar">
  <div class="navbar__left">
    {% if user.is_authenticated %}
      <button class="hamburger" type="button" data-sidebar-toggle="true" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    {% endif %}
    <a class="brand" href="{% url 'landing' %}">
      <span class="brand-mark">td</span>
      <span>teledent</span>
    </a>
  </div>

  <div class="navbar__right">
    {% if user.is_authenticated %}
      <span class="nav-avatar">DR</span>
      <span class="nav-muted">{% if current_profile %}{{ current_profile.full_name }}{% else %}[Dr. Name]{% endif %}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="nav-link" style="background:transparent;border:none;padding:0;cursor:pointer">Logout</button>
      </form>
    {% else %}
      <a class="nav-link" href="{% url 'login' %}">Sign In</a>
    {% endif %}
  </div>
</header>
